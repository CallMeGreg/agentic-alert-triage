# Alert dismissal triage configuration

# Trusted organization whose signed dismissal-request webhooks are accepted.
# Set this explicitly when the control repository has a different owner.
organization: callmegreg-demo-org

# deterministic: deny comments that fail the configured criteria.
# agentic: dispatch every created request to the gh-aw workflow.
# both: deny deterministic failures and dispatch passing requests.
review_mode: deterministic

# Optional deterministic criteria. If all are omitted, every comment passes.
# required_phrase: "mitigating control"
required_pattern: "https://github\\.com/callmegreg-demo-org/[a-zA-Z0-9._-]+/issues/\\d+"
# minimum_length: 20
case_sensitive: false

# All three official dismissal-request webhook categories are enabled by
# default. Remove a value to ignore that subscribed event safely.
alert_types:
  - code_scanning
  - dependabot
  - secret_scanning

agentic:
  # Central repository containing the compiled agentic workflow. The GitHub
  # App must also be installed on this repository (or its owner) with
  # Contents: write so it can create repository_dispatch events.
  workflow_repository: CallMeGreg/agentic-alert-triage

  # This team is assumed to hold GitHub's organization Security Manager role.
  appsec_team_slug: appsec-team

  # Preview SafeOutput decisions until the workflow has been evaluated.
  staged: true

  # Defaults to "@<organization>/<appsec_team_slug>" when omitted.
  # help_contact: "@callmegreg-demo-org/appsec-team"

  # Optional denial template. Available placeholders:
  # {requester}, {denial_reason}, {help_contact}, {alert_type},
  # {alert_number}, {repo_full_name}
  # denial_message: |
  #   Your dismissal request was denied: {denial_reason}
  #   Contact {help_contact} for help.

# Short-lived, bounded process-local caches reduce duplicate webhook work and
# GitHub API calls. They are not a durable queue or cross-replica lock.
cache:
  team_members_ttl_seconds: 300
  control_installation_ttl_seconds: 600
  delivery_dedupe_ttl_seconds: 900
  delivery_dedupe_max_entries: 1000

# Deterministic denial placeholders:
# {alert_type}, {alert_number}, {required_phrase}, {denial_reason},
# {requester}, {repo_full_name}
denial_message: |
  Alert Dismissal Request Denied
  Your request to dismiss this alert has been automatically denied.
  Reason: {denial_reason}
  Please create an issue using the following template and add the link to the dismissal request message: https://github.com/callmegreg-demo-org/app-xyz-repo/issues/new?template=foo.yml
