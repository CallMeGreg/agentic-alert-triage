# .github/workflows/alert-dismissal-check.yml
#
# Scheduled workflow that polls GitHub's org-level alert dismissal request APIs
# for pending requests and routes them through the deterministic and/or
# agentic review mode configured in config.yml.
#
# Requires delegated alert dismissal to be enabled in the organization.
# Authentication uses a GitHub App token so that all actions are attributed to
# the App and not to a personal account.  The App must be installed in the
# organization it is expected to manage.
#
# Required repository secrets:
#   ALERT_DISMISSAL_APP_CLIENT_ID   — GitHub App Client ID (e.g. Iv1.abc1234567890def)
#   ALERT_DISMISSAL_APP_PRIVATE_KEY — GitHub App private key in PEM format

name: Alert Dismissal Review

on:
  # Run on a schedule — default every 15 minutes.
  # Adjust the cron expression to match your preferred polling interval.
  # schedule:
  #   - cron: '*/15 * * * *'

  # Allow manual runs from the Actions tab (useful for testing and dry-runs).
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run — log what would change but make no API calls that modify
          alert state.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      debug:
        description: >
          Enable verbose debug logging to troubleshoot API calls,
          authentication, and response payloads.
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Minimal permissions for the built-in GITHUB_TOKEN.
# The actual work is done with the GitHub App token generated below.
permissions:
  contents: read

jobs:
  check-dismissals:
    name: Check Alert Dismissal Requests
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository so config.yml and the script are available.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # -----------------------------------------------------------------------
      # 2. Set up the Node.js runtime.
      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      # -----------------------------------------------------------------------
      # 3. Install dependencies from the lock file for a reproducible build.
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # 4. Resolve the monitored organization from trusted configuration.
      # -----------------------------------------------------------------------
      - name: Resolve workflow configuration
        id: workflow-config
        run: node scripts/export-workflow-config.js

      # -----------------------------------------------------------------------
      # 5. Exchange the App credentials for a short-lived installation token.
      #    The token is scoped to the configured organization.
      # -----------------------------------------------------------------------
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ALERT_DISMISSAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.ALERT_DISMISSAL_APP_PRIVATE_KEY }}
          owner: ${{ steps.workflow-config.outputs.organization }}

      # -----------------------------------------------------------------------
      # 6. Run the dismissal check script.
      # -----------------------------------------------------------------------
      - name: Check alert dismissal requests
        run: node scripts/check-dismissals.js
        env:
          # Use the App token — NOT the built-in GITHUB_TOKEN — so that API
          # calls are attributed to the GitHub App identity.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DEBUG: ${{ github.event.inputs.debug || 'false' }}
          # Override the config file path when needed (optional).
          # CONFIG_PATH: config.yml
