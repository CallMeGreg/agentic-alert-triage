# GitHub App manifest used by Probot's local setup flow.
# Updating this file does not update an existing GitHub App registration.
# Register this App under the enterprise or transfer the private App to it.
# Enterprise-owned Apps have
# internal visibility; public: false alone only allows the owning account.
# Also configure the enterprise-level "Enterprise teams" permission to Read
# in the enterprise App settings UI and install the App on the enterprise.
# The manifest below covers organization/repository permissions and events.
# See README.md for enterprise setup; organization-owned Apps are rejected.

name: Agentic Alert Triage
url: https://github.com/CallMeGreg/agentic-alert-triage
description: Webhook-driven deterministic and agentic review of delegated security alert dismissal requests.
public: false

default_events:
  - dismissal_request_code_scanning
  - dismissal_request_dependabot
  - dismissal_request_secret_scanning

default_permissions:
  contents: write
  issues: read
  metadata: read
  organization_code_scanning_dismissal_requests: write
  organization_dependabot_dismissal_requests: write
  secret_scanning_alerts: write
  secret_scanning_dismissal_requests: write
  security_events: write
  vulnerability_alerts: write

# These are GitHub's current documented permission slugs. Existing GitHub App
# registrations still need to be updated and approved in the App settings UI.
